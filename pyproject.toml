[project]
name = "sehyun-trading"
version = "0.1.0"
description = "한국 주식 중기 스윙 투자 보조 시스템"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "pykrx>=1.0.47",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b0",
    "requests>=2.32.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "backtrader>=1.9.78.123",
    "matplotlib>=3.9.0",
    "psycopg2-binary>=2.9.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
