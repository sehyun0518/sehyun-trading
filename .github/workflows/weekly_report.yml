name: Weekly Trading Report

on:
  schedule:
    - cron: '0 10 * * 0'  # 매주 일요일 19:00 KST (UTC+9)
  workflow_dispatch:
    inputs:
      date:
        description: '기준일 (YYYY-MM-DD, 기본: 오늘)'
        required: false
        default: ''
      cash:
        description: '현금 잔고 (원)'
        required: false
        default: '1000000'

permissions:
  contents: write

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Restore DB cache
        id: cache-db
        uses: actions/cache@v4
        with:
          path: data/market.db
          key: market-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-db-${{ runner.os }}-

      - name: Create .env
        env:
          KIS_MODE: ${{ secrets.KIS_MODE }}
          KIS_PAPER_APP_KEY: ${{ secrets.KIS_PAPER_APP_KEY }}
          KIS_PAPER_APP_SECRET: ${{ secrets.KIS_PAPER_APP_SECRET }}
          KIS_PAPER_ACCOUNT_NO: ${{ secrets.KIS_PAPER_ACCOUNT_NO }}
          KIS_REAL_APP_KEY: ${{ secrets.KIS_REAL_APP_KEY }}
          KIS_REAL_APP_SECRET: ${{ secrets.KIS_REAL_APP_SECRET }}
          KIS_REAL_ACCOUNT_NO: ${{ secrets.KIS_REAL_ACCOUNT_NO }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'EOF'
          import os
          keys = [
              "KIS_MODE",
              "KIS_PAPER_APP_KEY","KIS_PAPER_APP_SECRET","KIS_PAPER_ACCOUNT_NO",
              "KIS_REAL_APP_KEY","KIS_REAL_APP_SECRET","KIS_REAL_ACCOUNT_NO",
              "KRX_ID","KRX_PW","ANTHROPIC_API_KEY",
          ]
          with open(".env", "w") as f:
              for k in keys:
                  v = os.environ.get(k, "")
                  if v:
                      f.write(f"{k}={v}\n")
          print("✓ .env 생성 완료")
          EOF

      - name: Backfill DB (캐시 미스 시)
        run: |
          python - <<'EOF'
          import sqlite3, sys
          from pathlib import Path
          db = Path("data/market.db")
          if not db.exists():
              print("DB 없음 → 백필 필요")
              sys.exit(1)
          try:
              conn = sqlite3.connect(db)
              tables = [r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")]
              count = conn.execute("SELECT COUNT(*) FROM ohlcv").fetchone()[0] if "ohlcv" in tables else 0
              conn.close()
              if count < 1000:
                  print(f"DB rows={count} < 1000 → 백필 필요")
                  sys.exit(1)
              print(f"DB rows={count} → 백필 불필요")
          except Exception as e:
              print(f"DB 오류: {e} → 백필 필요")
              sys.exit(1)
          EOF
          if [ $? -eq 1 ]; then
            START=$(date -d "1 year ago" +%Y-%m-%d)
            echo "백필 시작: $START ~"
            uv run python scripts/backfill_ohlcv.py --start "$START"
          fi

      - name: Collect market data
        run: uv run python scripts/daily_collect.py

      - name: Generate weekly report
        env:
          REPORT_DATE: ${{ inputs.date }}
          CASH: ${{ inputs.cash || '1000000' }}
        run: |
          ARGS="--cash $CASH"
          [ -n "$REPORT_DATE" ] && ARGS="$ARGS --date $REPORT_DATE"
          uv run python scripts/weekly_report.py $ARGS

      - name: Push to GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki

          REPORT=$(ls -t reports/*.md | head -1)
          BASENAME=$(basename "$REPORT")
          cp "$REPORT" "wiki/$BASENAME"

          uv run python scripts/update_wiki_index.py wiki/

          cd wiki
          git add .
          git commit -m "리포트 업데이트: $BASENAME" || echo "변경사항 없음"
          git push
